name: Trigger EC2 Build from GitHub Runner

on:
  push:
    branches:
      - main

jobs:
  build-on-ec2:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH and run build on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${EC2_PORT:-22}" -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_ed25519 -p "${EC2_PORT:-22}" "$EC2_USER@$EC2_HOST" '
            set -e
            cd /home/ubuntu/Portfolio
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run build
            chmod 755 /home/ubuntu
            chmod -R o+rX /home/ubuntu/Portfolio/dist
          '
