<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0b5" />
      <stop offset="100%" stop-color="#e2b192" />
    </linearGradient>
  </defs>
  <!-- Background Circle with Amber/Orange Gradient -->
  <rect width="240" height="240" rx="120" fill="url(#avatarGrad)" />
  <!-- Body/Shoulders -->
  <path d="M40 220 C40 170, 75 150, 120 150 C165 150, 200 170, 200 220 Z" fill="#1c1917" opacity="0.9" />
  <!-- Shirt Collar -->
  <polygon points="120,165 105,150 135,150" fill="#fbbf24" />
  <!-- Head & Neck -->
  <rect x="110" y="130" width="20" height="25" rx="5" fill="url(#skinGrad)" />
  <circle cx="120" cy="98" r="42" fill="url(#skinGrad)" />
  <!-- Hair -->
  <path d="M78 95 C78 60, 95 48, 120 48 C145 48, 162 60, 162 95 C155 78, 140 70, 120 70 C95 70, 84 80, 78 95 Z" fill="#0f172a" />
  <!-- Glasses / Eyes -->
  <rect x="94" y="90" width="20" height="13" rx="4" fill="none" stroke="#0f172a" stroke-width="2.5" />
  <rect x="126" y="90" width="20" height="13" rx="4" fill="none" stroke="#0f172a" stroke-width="2.5" />
  <line x1="114" y1="96" x2="126" y2="96" stroke="#0f172a" stroke-width="2.5" />
  <!-- Smile -->
  <path d="M112 118 Q120 125 128 118" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" />
</svg>
